apiVersion: v1
kind: ConfigMap
metadata:
  name: ${name}
  namespace: ${namespace}
data:
  # language=yaml
  envoy.yaml: |
    static_resources:
      listeners:
        - name: http
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress
                    upgrade_configs:
                      - upgrade_type: websocket
                    route_config:
                      virtual_hosts:
                        - name: all
                          domains: ["*"]
                          routes:
                            - match: { path: "${faro_path}" }
                              route:
                                cluster: faro
                                prefix_rewrite: /collect
                                timeout: 10s
                            - match: { prefix: "/" }
                              route:
                                cluster: upstream
                                timeout: 0s
                              # The Lua filter rewrites the body, so the upstream must not compress it.
                              request_headers_to_add:
                                - header: { key: accept-encoding, value: identity }
                                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    http_filters:
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code:
                            # language=lua
                            inline_string: |
                              local snippet = [[<script src="https://unpkg.com/@grafana/faro-web-sdk@${faro_version}/dist/bundle/faro-web-sdk.iife.js"></script><script src="https://unpkg.com/@grafana/faro-web-tracing@${faro_version}/dist/bundle/faro-web-tracing.iife.js"></script><script>(function(){var f=window.GrafanaFaroWebSdk,t=window.GrafanaFaroWebTracing;if(!f||!t){return;}f.initializeFaro({url:location.origin+"${faro_path}",app:{name:"${app_name}",namespace:"${app_namespace}",environment:"${environment}"},instrumentations:[].concat(f.getWebInstrumentations(),[new t.TracingInstrumentation()])});})();</script>]]
                              function envoy_on_response(handle)
                                local ct = handle:headers():get("content-type")
                                if ct == nil or not string.find(ct, "text/html", 1, true) then
                                  return
                                end
                                local body = handle:body()
                                local html = body:getBytes(0, body:length())
                                local injected = string.gsub(html, "</head>", function() return snippet .. "</head>" end, 1)
                                body:setBytes(injected)
                                handle:headers():replace("content-length", tostring(#injected))
                              end
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: upstream
          type: STRICT_DNS
          load_assignment:
            cluster_name: upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: ${upstream_host}, port_value: ${upstream_port} }
        - name: faro
          type: STRICT_DNS
          load_assignment:
            cluster_name: faro
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: ${faro_host}, port_value: ${faro_port} }
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
