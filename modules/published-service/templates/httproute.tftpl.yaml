apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${name}
  namespace: ${namespace}
spec:
  parentRefs:
    - name: ${gateway_name}
      namespace: ${namespace}
  hostnames:
%{ for hostname in hostnames ~}
    - ${hostname}
%{ endfor ~}
  rules:
    - backendRefs:
        - name: ${proxy_name}
          port: 80
