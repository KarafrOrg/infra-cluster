apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${name}
  namespace: ${namespace}
%{ if private != null ~}
  annotations:
    external-dns.alpha.kubernetes.io/target: "${private.target_ip}"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
%{ endif ~}
spec:
  parentRefs:
%{ if private != null ~}
    - name: ${private.name}
      namespace: ${private.namespace}
%{ else ~}
    - name: ${gateway_name}
      namespace: ${namespace}
%{ endif ~}
  hostnames:
%{ for hostname in hostnames ~}
    - ${hostname}
%{ endfor ~}
  rules:
    - backendRefs:
        - name: ${proxy_name}
          port: 80
