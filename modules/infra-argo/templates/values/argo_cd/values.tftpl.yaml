namespaceOverride: "${argo_cd_helm_release_namespace}"
global:
  domain: "${argocd_ingress_domain}"

configs:
  params:
    server.insecure: true
  cm:
    # language=yaml
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $$argocd-github-sso-secret:clientID
            clientSecret: $$argocd-github-sso-secret:clientSecret
            orgs:
              - name: ${github_org}
  rbac:
    policy.default: role:readonly
    # language=csv
    policy.csv: |
      g, ${github_org}:${github_sso_admin_team}, role:admin

server:
  replicas: 3
  service:
    type: ClusterIP
  ingress:
    enabled: false

controller:
  replicas: 2

repoServer:
  replicas: 2

applicationSet:
  replicas: 2

redis:
  enabled: false

redis-ha:
  enabled: true
  replicas: 3

ha:
  enabled: true

dex:
  enabled: true
