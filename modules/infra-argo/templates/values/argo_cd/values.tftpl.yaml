namespaceOverride: "${argo_cd_helm_release_namespace}"

global:
  domain: "${argocd_ingress_domain}"

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

configs:
  params:
    server.insecure: true
    otlp.address: ${otlp_address}
    otlp.insecure: "true"

  cm:
    admin.enabled: "false"
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $argocd-github-sso-secret:clientID
            clientSecret: $argocd-github-sso-secret:clientSecret
            orgs:
              - name: ${github_org}

  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, ${github_org}:${github_sso_admin_team}, role:admin

server:
  replicas: 3

  service:
    type: ClusterIP

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

controller:
  replicas: 2

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  replicas: 2

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

applicationSet:
  replicas: 2

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

notifications:
  enabled: true

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # The chart creates an empty secret; the argocd-notifications-secret ExternalSecret merges the GitHub App keys into it.
  secret:
    create: true

  notifiers:
    service.github: |
      appID: $github-appID
      installationID: $github-installationID
      privateKey: $github-privateKey

  subscriptions:
    - recipients:
        - github
      triggers:
        - on-sync-running
        - on-deployed
        - on-sync-failed
        - on-health-degraded

  templates:
    template.app-sync-running: |
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.status.operationState.syncResult.revision}}"
        status:
          state: pending
          label: "argocd/{{.app.metadata.name}}"
          targetURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
        deployment:
          state: in_progress
          environment: "{{.app.spec.destination.namespace}}"
          environmentURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
          logURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
    template.app-deployed: |
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.status.operationState.syncResult.revision}}"
        status:
          state: success
          label: "argocd/{{.app.metadata.name}}"
          targetURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
        deployment:
          state: success
          environment: "{{.app.spec.destination.namespace}}"
          environmentURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
          logURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
        pullRequestComment:
          content: |
            Application {{.app.metadata.name}} is now running new version of deployments manifests.
            [See more info here](https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}?operation=true)
          commentTag: "continuous-delivery/{{.app.metadata.name}}"
        checkRun:
          name: "continuous-delivery/{{.app.metadata.name}}"
          details_url: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}?operation=true"
          status: completed
          conclusion: success
          started_at: "{{.app.status.operationState.startedAt}}"
          completed_at: "{{.app.status.operationState.finishedAt}}"
          output:
            title: "Deployment of {{.app.metadata.name}} on ArgoCD"
            summary: "Application {{.app.metadata.name}} is now running new version of deployments manifests."
            text: |
              Application {{.app.metadata.name}} is now running new version of deployments manifests.
              [See more info here](https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}?operation=true)
    template.app-failed: |
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.status.operationState.syncResult.revision}}"
        status:
          state: failure
          label: "argocd/{{.app.metadata.name}}"
          targetURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
        deployment:
          state: failure
          environment: "{{.app.spec.destination.namespace}}"
          environmentURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
          logURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"

  triggers:
    trigger.on-sync-running: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Running']
        send: [app-sync-running]
        oncePer: app.status.operationState.syncResult.revision
    trigger.on-deployed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
        send: [app-deployed]
        oncePer: app.status.operationState.syncResult.revision
    trigger.on-sync-failed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        send: [app-failed]
        oncePer: app.status.operationState.syncResult.revision
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        send: [app-failed]
        oncePer: app.status.operationState.syncResult.revision

redis:
  enabled: false

redis-ha:
  enabled: true
  replicas: 2

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  redis:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  sentinel:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

  haproxy:
    replicas: 2
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 128Mi

ha:
  enabled: true

dex:
  enabled: true

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi