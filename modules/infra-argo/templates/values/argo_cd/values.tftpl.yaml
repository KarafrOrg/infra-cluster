namespaceOverride: "${argo_cd_helm_release_namespace}"

global:
  domain: "${argocd_ingress_domain}"

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

configs:
  params:
    server.insecure: true
    otlp.address: ${otlp_address}
    otlp.insecure: "true"
    controller.repo.server.timeout.seconds: "900"
    server.repo.server.timeout.seconds: "900"

  cm:
    admin.enabled: "false"
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $argocd-github-sso-secret:clientID
            clientSecret: $argocd-github-sso-secret:clientSecret
            orgs:
              - name: ${github_org}

  cmp:
    create: true
    plugins:
      jsonnet-bundler:
        init:
          command: [sh, -c]
          args:
            - |
              set -eu
              if [ ! -f jsonnetfile.lock.json ]; then
                jb install
                exit 0
              fi
              if [ -e vendor ] || grep -qE '"local"[[:space:]]*:' jsonnetfile.json jsonnetfile.lock.json; then
                jb install
                exit 0
              fi
              dependency_key() {
                file_hash=$(sha256sum jsonnetfile.json) || return 1
                lock_hash=$(sha256sum jsonnetfile.lock.json) || return 1
                file_hash=$(printf '%s' "$file_hash" | cut -d ' ' -f1)
                lock_hash=$(printf '%s' "$lock_hash" | cut -d ' ' -f1)
                printf '%s-%s' "$file_hash" "$lock_hash"
              }
              key=$(dependency_key)
              cache=/jsonnet-cache/jb-v0.6.0-$key
              exec 9>"/jsonnet-cache/jb-v0.6.0-$key.lock"
              flock -x 9
              if [ -f "$cache/complete" ]; then
                cp -a "$cache/vendor" ./vendor
              else
                jb install
                updated_key=$(dependency_key)
                if [ "$key" = "$updated_key" ]; then
                  mkdir -p "$cache/vendor"
                  cp -a vendor/. "$cache/vendor/"
                  touch "$cache/complete"
                else
                  echo "Jsonnet dependency files changed during install; skipping cache" >&2
                fi
              fi
        generate:
          command: [sh, -c]
          args:
            - jsonnet -J vendor main.libsonnet
        discover:
          find:
            command: [sh, -c, find . -maxdepth 1 -name jsonnetfile.json]

  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, ${github_org}:${github_sso_admin_team}, role:admin

server:
  replicas: 3

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  service:
    type: ClusterIP

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

controller:
  replicas: 2

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

repoServer:
  replicas: 2

  env:
    - name: ARGOCD_EXEC_TIMEOUT
      value: 15m

  initContainers:
    - name: prepare-jsonnet-cache
      image: quay.io/argoproj/argocd:v3.5.7
      command: [sh, -c, "chown 999:999 /jsonnet-cache && chmod 770 /jsonnet-cache"]
      securityContext:
        runAsUser: 0
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: jsonnet-cache
          mountPath: /jsonnet-cache
    - name: install-jsonnet-tools
      image: golang:1.24.2-alpine3.21
      command: [sh, -c]
      args:
        - |
          set -eu
          GOBIN=/cmp-tools go install github.com/google/go-jsonnet/cmd/jsonnet@v0.21.0
          GOBIN=/cmp-tools go install github.com/jsonnet-bundler/jsonnet-bundler/cmd/jb@v0.6.0
      volumeMounts:
        - name: cmp-tools
          mountPath: /cmp-tools

  extraContainers:
    - name: cmp-jsonnet-bundler
      command:
        - /var/run/argocd/argocd-cmp-server
      image: quay.io/argoproj/argocd:v3.5.7
      env:
        - name: ARGOCD_EXEC_TIMEOUT
          value: 15m
        - name: PATH
          value: /cmp-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: jsonnet-bundler.yaml
          name: cmp-config
        - mountPath: /tmp
          name: cmp-tmp
        - mountPath: /cmp-tools
          name: cmp-tools
          readOnly: true
        - mountPath: /jsonnet-cache
          name: jsonnet-cache

  volumes:
    - name: cmp-config
      configMap:
        name: argocd-cmp-cm
    - name: cmp-tmp
      emptyDir: {}
    - name: cmp-tools
      emptyDir: {}
    - name: jsonnet-cache
      persistentVolumeClaim:
        claimName: argocd-jsonnet-cache

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  resources:
    requests:
      cpu: 300m
      memory: 128Mi
    limits:
      cpu: 600m
      memory: 512Mi

extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: argocd-jsonnet-cache
    spec:
      accessModes:
        - ReadWriteMany
      storageClassName: longhorn
      resources:
        requests:
          storage: 2Gi

applicationSet:
  replicas: 2

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

notifications:
  enabled: true

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # The chart creates an empty secret; the argocd-notifications-secret ExternalSecret merges the GitHub App keys into it.
  secret:
    create: true

  notifiers:
    service.github: |
      appID: $github-appID
      installationID: $github-installationID
      privateKey: $github-privateKey

  subscriptions:
    - recipients:
        - github
      triggers:
        - on-sync-running
        - on-deployed
        - on-sync-failed
        - on-health-degraded

  templates:
    template.app-sync-running: |
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.status.operationState.syncResult.revision}}"
        status:
          state: pending
          label: "argocd/{{.app.metadata.name}}"
          targetURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
        deployment:
          state: in_progress
          environment: "{{.app.metadata.name}}"
          environmentURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
          logURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
    template.app-deployed: |
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.status.operationState.syncResult.revision}}"
        status:
          state: success
          label: "argocd/{{.app.metadata.name}}"
          targetURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
        deployment:
          state: success
          environment: "{{.app.metadata.name}}"
          environmentURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
          logURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
        pullRequestComment:
          content: |
            Application {{.app.metadata.name}} is now running new version of deployments manifests.
            [See more info here](https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}?operation=true)
          commentTag: "continuous-delivery/{{.app.metadata.name}}"
        checkRun:
          name: "continuous-delivery/{{.app.metadata.name}}"
          details_url: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}?operation=true"
          status: completed
          conclusion: success
          started_at: "{{.app.status.operationState.startedAt}}"
          completed_at: "{{.app.status.operationState.finishedAt}}"
          output:
            title: "Deployment of {{.app.metadata.name}} on ArgoCD"
            summary: "Application {{.app.metadata.name}} is now running new version of deployments manifests."
            text: |
              Application {{.app.metadata.name}} is now running new version of deployments manifests.
              [See more info here](https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}?operation=true)
    template.app-failed: |
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.status.operationState.syncResult.revision}}"
        status:
          state: failure
          label: "argocd/{{.app.metadata.name}}"
          targetURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
        deployment:
          state: failure
          environment: "{{.app.metadata.name}}"
          environmentURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"
          logURL: "https://${argocd_ingress_domain}/applications/{{.app.metadata.name}}"

  triggers:
    trigger.on-sync-running: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Running']
        send: [app-sync-running]
        oncePer: app.status.operationState.syncResult.revision
    trigger.on-deployed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
        send: [app-deployed]
        oncePer: app.status.operationState.syncResult.revision
    trigger.on-sync-failed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        send: [app-failed]
        oncePer: app.status.operationState.syncResult.revision
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        send: [app-failed]
        oncePer: app.status.operationState.syncResult.revision

redis:
  enabled: false

redis-ha:
  enabled: true
  replicas: 2

  exporter:
    enabled: true
    serviceMonitor:
      enabled: true

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  redis:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  sentinel:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 64Mi

  haproxy:
    replicas: 2
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 128Mi

ha:
  enabled: true

dex:
  enabled: true

  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi