apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: argocd-webhook-gateway
  namespace: ${istio_gateway_namespace}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: ${argo_cd_helm_release_namespace}
  to:
    - group: ""
      kind: Service
      name: ${istio_gateway_name}-istio
