---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: github-org-discovery
  namespace: ${argo_cd_helm_release_namespace}
spec:
  goTemplate: true
  generators:
    - scmProvider:
        github:
          organization: ${argo_cd_github_org}
          appSecretName: github-app-repo-creds
        filters:
          - labelMatch: 'argocd-infra'
  template:
    metadata:
      # language=gotemplate
      name: '{{ .repository | lower | replace "_" "-" }}'
      namespace: ${argo_cd_helm_release_namespace}
    spec:
      project: default
      source:
        repoURL: '{{ .url }}'
        targetRevision: '{{ .branch }}'
        path: .
      destination:
        server: https://kubernetes.default.svc
        # language=gotemplate
        namespace: '{{ .repository | lower | replace "_" "-" }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
