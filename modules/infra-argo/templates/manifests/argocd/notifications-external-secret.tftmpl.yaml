---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: ${argo_cd_helm_release_namespace}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Merge
  data:
    - secretKey: github-appID
      remoteRef:
        key: ${github_app_id_gcp_secret_id}
    - secretKey: github-installationID
      remoteRef:
        key: ${github_app_installation_id_gcp_secret_id}
    - secretKey: github-privateKey
      remoteRef:
        key: ${github_app_private_key_gcp_secret_id}
