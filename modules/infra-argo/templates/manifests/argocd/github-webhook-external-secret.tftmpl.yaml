---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-webhook
  namespace: ${argo_cd_helm_release_namespace}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: ${github_webhook_gcp_secret_id}
