apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-carto
  namespace: ${namespace}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ${secret_store_name}
    kind: ClusterSecretStore
  target:
    name: grafana-carto
    creationPolicy: Owner
    # CARTO serves raster tiles with a watermark unless a key is sent; Grafana reads the whole layer config from one setting.
    template:
      data:
        baselayerConfig: '{"type":"xyz","config":{"attribution":"© CARTO © OpenStreetMap contributors","url":"https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key={{ .apiKey }}"}}'
  data:
    - secretKey: apiKey
      remoteRef:
        key: ${api_key_gcp_secret_id}
