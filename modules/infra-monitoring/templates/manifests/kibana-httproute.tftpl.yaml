apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana
  namespace: ${namespace}
spec:
  parentRefs:
    - name: ${gateway_name}
      namespace: ${gateway_namespace}
  hostnames:
    - kibana.karafra.net
    - kibana.kubernetes.karafra.net
  rules:
    - backendRefs:
        - name: monitoring-kibana-kb-http
          port: 5601
