apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-com-proxy-token
  namespace: ${namespace}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ${secret_store_name}
    kind: ClusterSecretStore
  target:
    name: grafana-com-proxy-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: ${proxy_token_gcp_secret_id}
