apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: ${namespace}
spec:
  parentRefs:
    - name: ${gateway_name}
      namespace: ${gateway_namespace}
  hostnames:
    - grafana.karafra.net
    - grafana.kubernetes.karafra.net
  rules:
    - backendRefs:
        - name: ${service_name}
          port: 80
