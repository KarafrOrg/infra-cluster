apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-github-oauth
  namespace: ${namespace}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ${secret_store_name}
    kind: ClusterSecretStore
  target:
    name: grafana-github-oauth
    creationPolicy: Owner
  data:
    - secretKey: clientID
      remoteRef:
        key: ${client_id_gcp_secret_id}
    - secretKey: clientSecret
      remoteRef:
        key: ${client_secret_gcp_secret_id}
