ingester:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  persistentVolume:
    storageClass: longhorn
    size: 50Gi
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 3Gi
  topologySpreadConstraints: {}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - ingester
          topologyKey: "kubernetes.io/hostname"
  zoneAwareReplication:
    topologyKey: "kubernetes.io/hostname"
    # Zone StatefulSets ignore the component-level nodeSelector.
    zones:
      - name: zone-a
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""
      - name: zone-b
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""
      - name: zone-c
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""

