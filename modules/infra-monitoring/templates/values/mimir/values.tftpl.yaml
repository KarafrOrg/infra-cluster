# All components are scheduled on control-plane nodes.
# Based on mimir-distributed small.yaml, with at least 2 replicas for every stateless component.
# Single-tenant setup: no X-Scope-OrgID header required from Alloy/Grafana.
mimir:
  structuredConfig:
    multitenancy_enabled: false
    distributor:
      # Allow Kafka quorum elections to complete before rejecting metric writes.
      remote_timeout: 15s
    ingest_storage:
      kafka:
        # One partition per ingester zone is enough here; the chart default of 100 (x3 replicas) overwhelms the brokers.
        auto_create_topic_default_partitions: 3
    limits:
      compactor_blocks_retention_period: 30d
      # Monitoring mixins exceed the default limit of 70 rule groups per tenant.
      ruler_max_rule_groups_per_tenant: 500
      # Monitoring mixins include rule groups larger than the default of 20.
      ruler_max_rules_per_rule_group: 500
      # Span-metric exemplars link metrics to traces in Grafana.
      max_global_exemplars_per_user: 100000
      # Span metrics from Tempo/Beyla plus ServiceMonitor targets exceeded 300k; ingesters need ~1.5Gi per 300k series.
      max_global_series_per_user: 800000
      # Default 10k/s is below what ~300k series at a 60s scrape interval plus backlog replays push.
      ingestion_rate: 50000
      ingestion_burst_size: 1000000

alertmanager:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  persistentVolume:
    storageClass: longhorn
    enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  statefulSet:
    enabled: true

compactor:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  persistentVolume:
    storageClass: longhorn
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

distributor:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  replicas: 2
  env:
    - name: GOGC
      value: "200"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

ingester:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  persistentVolume:
    storageClass: longhorn
    size: 50Gi
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 3Gi
    limits:
      memory: 6Gi
  topologySpreadConstraints: {}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - ingester
          topologyKey: "kubernetes.io/hostname"
  zoneAwareReplication:
    topologyKey: "kubernetes.io/hostname"
    # Zone StatefulSets ignore the component-level nodeSelector.
    zones:
      - name: zone-a
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""
      - name: zone-b
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""
      - name: zone-c
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""

