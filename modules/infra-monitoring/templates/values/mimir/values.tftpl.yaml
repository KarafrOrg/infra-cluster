# All components are scheduled on control-plane nodes.
# Based on mimir-distributed small.yaml, with at least 2 replicas for every stateless component.
# Single-tenant setup: no X-Scope-OrgID header required from Alloy/Grafana.
mimir:
  structuredConfig:
    multitenancy_enabled: false
    limits:
      # Span-metric exemplars link metrics to traces in Grafana.
      max_global_exemplars_per_user: 100000
      # Span metrics from Tempo/Beyla make up most series; 150k default was exceeded.
      max_global_series_per_user: 300000

alertmanager:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  persistentVolume:
    storageClass: longhorn
    enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  statefulSet:
    enabled: true

compactor:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  persistentVolume:
    storageClass: longhorn
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

distributor:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
