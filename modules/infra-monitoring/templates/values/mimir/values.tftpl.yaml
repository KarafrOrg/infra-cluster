      cpu: 1
      memory: 512Mi

query_scheduler:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

rollout_operator:
  nodeSelector:
