  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

kafka:
  replicas: 3
  logRetentionHours: 3
  # Mimir auto-creates its ingest topic with the broker default; with RF=1 losing one broker's volume
  # wipes the topic and leaves ingesters pointing at offsets that no longer exist.
  env:
    - name: KAFKA_DEFAULT_REPLICATION_FACTOR
      value: "3"
    - name: KAFKA_MIN_INSYNC_REPLICAS
      value: "2"
    - name: KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS
      value: "3"
    # Defaults (1s election / 2s fetch) cause constant leader elections on Longhorn-backed brokers.
    - name: KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS
      value: "5000"
    - name: KAFKA_CONTROLLER_QUORUM_FETCH_TIMEOUT_MS
      value: "10000"
    - name: KAFKA_CONTROLLER_QUORUM_ELECTION_TIMEOUT_MS
      value: "5000"
    - name: KAFKA_CONTROLLER_QUORUM_ELECTION_BACKOFF_MAX_MS
      value: "5000"
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 100Gi

metaMonitoring:
  serviceMonitor:
    enabled: true
