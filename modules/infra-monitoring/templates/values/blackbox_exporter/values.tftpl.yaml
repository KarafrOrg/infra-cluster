replicas: 2

deploymentAnnotations:
  configmap.reloader.stakater.com/auto: "true"

nodeSelector:
  node-role.kubernetes.io/control-plane: ""
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        preferred_ip_protocol: ip4
    github_status:
      prober: http
      timeout: 5s
      http:
        preferred_ip_protocol: ip4
        fail_if_body_json_not_matches_cel: "body.status.indicator == 'none'"
    tcp_connect:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4

serviceMonitor:
  selfMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  enabled: true
  defaults:
    interval: 30s
    scrapeTimeout: 10s
  targets: ${jsonencode(targets)}
