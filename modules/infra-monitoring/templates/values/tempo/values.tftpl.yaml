global:
  storageClass: longhorn

# Distributed Tempo sized like the Mimir setup; all components run on control-plane nodes.
traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: ${release_name}-minio:9000
      access_key: grafana-tempo
      secret_key: supersecret
      insecure: true

# Bundled MinIO is used as object storage; replace with external S3/GCS if available.
minio:
  # The bundled mc in the silo image rejects the chart's legacy `admin policy set`, failing the user hook.
  # Tempo only needs the root credentials, so skip creating the console user.
  users: []
  # The RWO Longhorn volume cannot be attached to the old and new pod at once during a rollout.
  DeploymentUpdate:
    type: Recreate
  serviceAccount:
    name: tempo-minio
  # The upstream quay.io/minio images are no longer pullable; use the pgsty/silo fork (bundles mc).
  image:
    repository: pgsty/silo
    tag: RELEASE.2026-09-03T13-18-01Z
  mcImage:
    repository: pgsty/silo
    tag: RELEASE.2026-09-03T13-18-01Z
  persistence:
    storageClass: longhorn
    size: 250Gi
    annotations:
      helm.sh/resource-policy: keep
  enabled: true
  makeUserJob:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  makeBucketJob:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

memcached:
  enabled: true
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

gateway:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# Required for TraceQL metrics queries (rate() etc.) in Grafana; service graph and span metrics come from Alloy.
metricsGenerator:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  config:
    processor:
      local_blocks:
        filter_server_spans: false
        flush_to_storage: true

overrides:
  defaults:
    metrics_generator:
      processors:
        - local-blocks

distributor:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

ingester:
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 4Gi
  persistence:
    enabled: true
    size: 50Gi
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

querier:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

queryFrontend:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

compactor:
  replicas: 1
  config:
    compaction:
      block_retention: 720h
  resources:
    requests:
      cpu: 100m
      memory: 2Gi
    limits:
      memory: 3Gi
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

metaMonitoring:
  serviceMonitor:
    enabled: true
