alloy:
  clustering:
    enabled: true

  configMap:
    content: |
      logging {
        level  = "debug"
        format = "logfmt"
      }

      prometheus.operator.servicemonitors "kubernetes" {
        forward_to = [
          otelcol.receiver.prometheus.kubernetes.receiver,
        ]
      }

      otelcol.receiver.prometheus "kubernetes" {
        output {
          metrics = [
            otelcol.processor.k8sattributes.telemetry.input,
          ]
        }
      }

      otelcol.receiver.otlp "applications" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }

        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          metrics = [
            otelcol.processor.k8sattributes.telemetry.input,
          ]

          logs = [
            otelcol.processor.k8sattributes.telemetry.input,
          ]

          traces = [
            otelcol.connector.spanmetrics.default.input,
            otelcol.processor.k8sattributes.telemetry.input,
          ]
        }
      }

      otelcol.processor.k8sattributes "telemetry" {
        extract {
          metadata = [
            "k8s.namespace.name",
            "k8s.pod.name",
            "k8s.pod.uid",
            "k8s.deployment.name",
            "k8s.statefulset.name",
            "k8s.daemonset.name",
            "k8s.job.name",
            "k8s.cronjob.name",
            "k8s.node.name",
            "k8s.container.name",
          ]
        }

        output {
          metrics = [
            otelcol.processor.batch.metrics.input,
          ]

          logs = [
            otelcol.processor.batch.logs.input,
          ]

          traces = [
            otelcol.processor.batch.traces.input,
          ]
        }
      }

      otelcol.connector.spanmetrics "default" {
        namespace = "traces.span.metrics"
        metrics_flush_interval = "15s"
        aggregation_cardinality_limit = 10000

        histogram {
          unit = "ms"

          explicit {
            buckets = [
              "2ms",
              "4ms",
              "8ms",
              "16ms",
              "32ms",
              "64ms",
              "128ms",
              "256ms",
              "512ms",
              "1s",
              "2s",
              "4s",
              "8s",
              "16s",
              "32s",
            ]
          }
        }

        dimension {
          name = "http.request.method"
        }

        dimension {
          name = "http.route"
        }

        dimension {
          name = "http.response.status_code"
        }

        dimension {
          name = "k8s.namespace.name"
        }

        dimension {
          name = "deployment.environment.name"
        }

        exemplars {
          enabled = true
          max_per_data_point = 5
        }

        output {
          metrics = [
            otelcol.processor.k8sattributes.telemetry.input,
          ]
        }
      }

      otelcol.processor.batch "metrics" {
        timeout = "2s"
        send_batch_size = 1000

        output {
          metrics = [
            otelcol.exporter.otlphttp.elasticsearch.input,
          ]
        }
      }

      otelcol.processor.batch "logs" {
        timeout = "2s"
        send_batch_size = 1000

        output {
          logs = [
            otelcol.exporter.otlphttp.elasticsearch.input,
          ]
        }
      }

      otelcol.processor.batch "traces" {
        timeout = "2s"
        send_batch_size = 1000

        output {
          traces = [
            otelcol.exporter.otlphttp.elasticsearch.input,
          ]
        }
      }

      otelcol.auth.basic "elasticsearch" {
        username = sys.env("ES_USERNAME")
        password = sys.env("ES_PASSWORD")
      }

      otelcol.exporter.otlphttp "elasticsearch" {
        client {
          endpoint = "https://monitoring-elasticsearch-es-http:9200"

          auth = otelcol.auth.basic.elasticsearch.handler

          compression = "gzip"
          timeout = "30s"

          tls {
            ca_file = "/etc/alloy/certs/ca.crt"
          }
        }

        sending_queue {
          enabled = true
          queue_size = 10000
        }

        retry_on_failure {
          enabled = true
        }
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node_name"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets = discovery.relabel.pod_logs.output

        forward_to = [
          otelcol.receiver.loki.pods.receiver,
        ]
      }

      otelcol.receiver.loki "pods" {
        output {
          logs = [
            otelcol.processor.k8sattributes.telemetry.input,
          ]
        }
      }

  extraEnv:
    - name: ES_USERNAME
      value: "elastic"

    - name: ES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: monitoring-elasticsearch-es-elastic-user
          key: elastic

  storagePath: /var/lib/alloy

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

  mounts:
    extra:
      - name: elasticsearch-ca
        mountPath: /etc/alloy/certs
        readOnly: true

controller:
  type: statefulset
  replicas: 3

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  volumes:
    extra:
      - name: alloy-storage
        emptyDir: {}

      - name: elasticsearch-ca
        secret:
          secretName: monitoring-elasticsearch-es-remote-ca

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
          topologyKey: kubernetes.io/hostname

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: alloy
