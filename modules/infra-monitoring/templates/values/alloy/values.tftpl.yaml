alloy:
  # otelcol.receiver.tcplog is experimental.
  stabilityLevel: experimental

  clustering:
    enabled: true

  configMap:
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      prometheus.operator.servicemonitors "kubernetes" {
        forward_to = [
          otelcol.receiver.prometheus.kubernetes.receiver,
        ]
      }

      prometheus.operator.podmonitors "kubernetes" {
        forward_to = [
          otelcol.receiver.prometheus.kubernetes.receiver,
        ]
      }

      // Syncs PrometheusRule objects to the Mimir ruler.
      mimir.rules.kubernetes "kubernetes" {
        address = "http://${mimir_release_name}-gateway.${mimir_namespace}.svc.cluster.local"
      }

      discovery.kubernetes "services" {
        role = "service"
      }

      discovery.relabel "annotated_services" {
        targets = discovery.kubernetes.services.targets

        rule {
          source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
          action        = "keep"
          regex         = "true"
        }

        rule {
          source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_path"]
          action        = "replace"
          regex         = "(.+)"
          target_label  = "__metrics_path__"
        }

        rule {
          source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scheme"]
          action        = "replace"
          regex         = "(https?)"
          target_label  = "__scheme__"
        }

        rule {
          source_labels = [
            "__address__",
            "__meta_kubernetes_service_annotation_prometheus_io_port",
          ]
          action        = "replace"
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
          target_label  = "__address__"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          target_label  = "service"
        }
      }

      prometheus.scrape "annotated_services" {
        targets    = discovery.relabel.annotated_services.output
        forward_to = [otelcol.receiver.prometheus.kubernetes.receiver]
      }

      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
      }

      prometheus.scrape "kubelet" {
        targets         = discovery.relabel.kubelet.output
        job_name        = "kubelet"
        scheme          = "https"
        metrics_path    = "/metrics"
        scrape_interval = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

        tls_config {
          insecure_skip_verify = true
        }

        clustering {
          enabled = true
        }

        forward_to = [otelcol.receiver.prometheus.kubernetes.receiver]
      }

      prometheus.scrape "cadvisor" {
        targets         = discovery.relabel.kubelet.output
        job_name        = "cadvisor"
        scheme          = "https"
        metrics_path    = "/metrics/cadvisor"
        scrape_interval = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

        tls_config {
          insecure_skip_verify = true
        }

        clustering {
          enabled = true
        }

        forward_to = [otelcol.receiver.prometheus.kubernetes.receiver]
      }

      otelcol.receiver.prometheus "kubernetes" {
        output {
          metrics = [
            otelcol.processor.k8sattributes.telemetry.input,
          ]
        }
      }

      otelcol.receiver.otlp "applications" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }

        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          metrics = [
            otelcol.processor.k8sattributes.telemetry.input,
          ]

          logs = [
            otelcol.processor.k8sattributes.telemetry.input,
          ]

          traces = [
            otelcol.connector.spanmetrics.default.input,
            otelcol.connector.servicegraph.default.input,
            otelcol.processor.k8sattributes.telemetry.input,
          ]
        }
      }

      // Browser telemetry (Faro SDK) is forwarded same-origin by the per-service Envoy proxies.
      faro.receiver "browser" {
        server {
          listen_address = "0.0.0.0"
          listen_port    = 12347
        }

        output {
          logs = [
            otelcol.receiver.loki.faro.receiver,
          ]

          traces = [
            otelcol.processor.transform.faro_source.input,
          ]
        }
      }

      // Marks browser traces so they can be queried as { resource.telemetry.source = "faro" }.
      otelcol.processor.transform "faro_source" {
        error_mode = "ignore"

        trace_statements {
          context = "resource"
          statements = [
            "set(attributes[\"telemetry.source\"], \"faro\")",
          ]
        }

        output {
          traces = [
            otelcol.connector.spanmetrics.default.input,
            otelcol.processor.batch.traces.input,
          ]
        }
      }

      otelcol.receiver.loki "faro" {
        output {
          logs = [
            otelcol.processor.transform.faro_logs.input,
          ]
        }
      }

      otelcol.processor.transform "faro_logs" {
        error_mode = "ignore"

        log_statements {
          context = "log"
          statements = [
            "set(resource.attributes[\"service.name\"], ExtractPatterns(body.string, \"app_name=(?P<app>[^ ]+)\")[\"app\"])",
            "set(resource.attributes[\"telemetry.source\"], \"faro\")",
          ]
        }

        output {
          logs = [
            otelcol.processor.k8sattributes.telemetry.input,
          ]
        }
      }

      otelcol.receiver.tcplog "talos" {
        listen_address = "0.0.0.0:5170"

        output {
          logs = [
            otelcol.processor.transform.talos_logs.input,
          ]
        }
      }

      otelcol.processor.transform "talos_logs" {
        error_mode = "ignore"

        // Resource attributes are shared by every record in a batch, so per-record fields stay log attributes.
        log_statements {
          context = "log"
          statements = [
            "set(log.cache, ParseJSON(log.body.string)) where IsMatch(log.body.string, \"^\\\\s*\\\\{\")",
            "merge_maps(log.attributes, log.cache, \"upsert\") where log.cache != nil",
            "set(log.time, Time(log.cache[\"talos-time\"], \"%Y-%m-%dT%H:%M:%S.%f%z\")) where log.cache[\"talos-time\"] != nil",
            "set(log.time, log.observed_time) where log.time_unix_nano == 0",
            "set(log.severity_text, log.cache[\"talos-level\"]) where log.cache[\"talos-level\"] != nil",
            "set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.severity_text == \"debug\"",
            "set(log.severity_number, SEVERITY_NUMBER_INFO) where log.severity_text == \"info\"",
            "set(log.severity_number, SEVERITY_NUMBER_WARN) where log.severity_text == \"warn\" or log.severity_text == \"warning\"",
            "set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.severity_text == \"error\"",
            "set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.severity_text == \"fatal\" or log.severity_text == \"panic\"",
            "set(log.attributes[\"talos.service\"], log.cache[\"talos-service\"]) where log.cache[\"talos-service\"] != nil",
            "set(log.body, log.cache[\"msg\"]) where log.cache[\"msg\"] != nil",
            "delete_key(log.attributes, \"msg\")",
            "delete_key(log.attributes, \"talos-time\")",
            "delete_key(log.attributes, \"talos-level\")",
            "delete_key(log.attributes, \"talos-service\")",
          ]
        }

        log_statements {
          context = "resource"
          statements = [
            "set(resource.attributes[\"service.name\"], \"talos\")",
            "set(resource.attributes[\"telemetry.source\"], \"talos\")",
          ]
        }

        output {
          logs = [
            otelcol.processor.k8sattributes.telemetry.input,
          ]
        }
      }

      otelcol.processor.k8sattributes "telemetry" {
        extract {
          metadata = [
            "k8s.namespace.name",
            "k8s.pod.name",
            "k8s.pod.uid",
            "k8s.deployment.name",
            "k8s.statefulset.name",
            "k8s.daemonset.name",
            "k8s.job.name",
            "k8s.cronjob.name",
            "k8s.node.name",
            "k8s.container.name",
          ]
        }

        output {
          metrics = [
            otelcol.processor.batch.metrics.input,
          ]

          logs = [
            otelcol.processor.batch.logs.input,
          ]

          traces = [
            otelcol.processor.batch.traces.input,
          ]
        }
      }

      otelcol.connector.spanmetrics "default" {
        namespace = "traces.span.metrics"
        metrics_flush_interval = "15s"
        aggregation_cardinality_limit = 10000

        histogram {
          unit = "ms"

          explicit {
            buckets = [
              "2ms",
              "4ms",
              "8ms",
              "16ms",
              "32ms",
              "64ms",
              "128ms",
              "256ms",
              "512ms",
              "1s",
              "2s",
              "4s",
              "8s",
              "16s",
              "32s",
            ]
          }
        }

        dimension {
          name = "http.request.method"
        }

        dimension {
          name = "http.route"
        }

        dimension {
          name = "http.response.status_code"
        }

        dimension {
          name = "k8s.namespace.name"
        }

        dimension {
          name = "deployment.environment.name"
        }

        exemplars {
          enabled = true
          max_per_data_point = 5
        }

        output {
          metrics = [
            otelcol.processor.transform.replica_label.input,
          ]
        }
      }

      // Service graph edges are paired from client/server spans and stored in Mimir for Grafana's Tempo service map.
      otelcol.connector.servicegraph "default" {
        dimensions             = ["k8s.namespace.name"]
        metrics_flush_interval = "15s"

        store {
          ttl       = "10s"
          max_items = 10000
        }

        output {
          metrics = [
            otelcol.processor.transform.replica_label.input,
          ]
        }
      }

      otelcol.processor.transform "replica_label" {
        error_mode = "ignore"

        metric_statements {
          context = "resource"
          statements = [
            "set(attributes[\"alloy.replica\"], \"" + sys.env("HOSTNAME") + "\")",
          ]
        }

        metric_statements {
          context = "datapoint"
          statements = [
            "set(attributes[\"alloy_replica\"], \"" + sys.env("HOSTNAME") + "\")",
          ]
        }

        output {
          metrics = [
            otelcol.processor.k8sattributes.telemetry.input,
          ]
        }
      }

      otelcol.processor.batch "metrics" {
        timeout = "2s"
        send_batch_size = 1000

        output {
          metrics = [
            otelcol.exporter.otlphttp.mimir.input,
          ]
        }
      }

      otelcol.processor.batch "logs" {
        timeout = "2s"
        send_batch_size = 1000

        output {
          logs = [
            otelcol.exporter.otlphttp.loki.input,
          ]
        }
      }

      otelcol.processor.batch "traces" {
        timeout = "2s"
        send_batch_size = 1000

        output {
          traces = [
            otelcol.exporter.otlphttp.tempo.input,
          ]
        }
      }

      otelcol.exporter.otlphttp "mimir" {
        client {
          endpoint = "http://${mimir_release_name}-gateway.${mimir_namespace}.svc.cluster.local/otlp"

          compression = "gzip"
          timeout = "30s"
        }

        sending_queue {
          enabled = true
          queue_size = 10000
        }

        retry_on_failure {
          enabled = true
        }
      }

      otelcol.exporter.otlphttp "loki" {
        client {
          endpoint = "http://${loki_release_name}-gateway.${loki_namespace}.svc.cluster.local/otlp"

          compression = "gzip"
          timeout = "30s"
        }

        sending_queue {
          enabled = true
          queue_size = 10000
        }

        retry_on_failure {
          enabled = true
        }
      }

      otelcol.exporter.otlphttp "tempo" {
        client {
          endpoint = "http://${tempo_release_name}-gateway.${tempo_namespace}.svc.cluster.local"

          compression = "gzip"
          timeout = "30s"
        }

        sending_queue {
          enabled = true
          queue_size = 10000
        }

        retry_on_failure {
          enabled = true
        }
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node_name"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets = discovery.relabel.pod_logs.output

        forward_to = [
          otelcol.receiver.loki.pods.receiver,
        ]
      }

      otelcol.receiver.loki "pods" {
        output {
          logs = [
            otelcol.processor.transform.log_service_name.input,
          ]
        }
      }

      // Logs from loki.source.kubernetes carry no OTLP service.name, so Loki labels them unknown_service.
      otelcol.processor.transform "log_service_name" {
        error_mode = "ignore"

        log_statements {
          context = "log"
          statements = [
            "set(resource.attributes[\"service.name\"], attributes[\"app\"]) where resource.attributes[\"service.name\"] == nil and attributes[\"app\"] != nil",
            "set(resource.attributes[\"service.name\"], attributes[\"container\"]) where resource.attributes[\"service.name\"] == nil and attributes[\"container\"] != nil",
            "set(resource.attributes[\"k8s.namespace.name\"], attributes[\"namespace\"]) where resource.attributes[\"k8s.namespace.name\"] == nil and attributes[\"namespace\"] != nil",
            "set(resource.attributes[\"k8s.pod.name\"], attributes[\"pod\"]) where resource.attributes[\"k8s.pod.name\"] == nil and attributes[\"pod\"] != nil",
            "set(resource.attributes[\"k8s.container.name\"], attributes[\"container\"]) where resource.attributes[\"k8s.container.name\"] == nil and attributes[\"container\"] != nil",
          ]
        }

        output {
          logs = [
            otelcol.processor.k8sattributes.telemetry.input,
          ]
        }
      }

  storagePath: /var/lib/alloy

  mounts:
    extra:
      - name: alloy-storage
        mountPath: /var/lib/alloy

  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2
      memory: 6Gi

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: faro
      port: 12347
      targetPort: 12347
      protocol: TCP
    - name: talos-logs
      port: 5170
      targetPort: 5170
      protocol: TCP

service:
  clusterIP: 10.101.101.141
  annotations:
    external-dns.alpha.kubernetes.io/hostname: otelcol.internal.karafra.net
    external-dns.alpha.kubernetes.io/ttl: "60"

controller:
  type: statefulset
  replicas: 3

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  volumeClaimTemplates:
    - metadata:
        name: alloy-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
              app.kubernetes.io/instance: alloy
          topologyKey: kubernetes.io/hostname

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: alloy
          app.kubernetes.io/instance: alloy

serviceMonitor:
  enabled: true
