apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-gateway-controller-creds
  namespace: ${namespace}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: cloudflare-gateway-controller-creds
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_ACCOUNT_ID
      remoteRef:
        key: ${cloudflare_account_id_secret}
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: ${cloudflare_api_token_secret}
