apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${gateway_name}
  namespace: ${istio_namespace}
  labels:
    dns.karafra.net/private: "true"
  annotations:
    # external-dns reads the target from the Gateway, not the HTTPRoute. The public record points at loopback so
    # clients without WARP fail instantly; WARP clients get ${cluster_ip} from a Cloudflare Gateway DNS override.
    external-dns.alpha.kubernetes.io/target: ${public_dns_target}
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  gatewayClassName: ${gateway_class_name}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: ${gateway_name}-config
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: '*.${ingress_domain}'
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      port: 443
      protocol: HTTPS
      hostname: '*.${ingress_domain}'
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: ${gateway_name}-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: webhook
      port: 8081
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
