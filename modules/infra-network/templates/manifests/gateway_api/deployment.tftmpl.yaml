apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-controller-manager
  namespace: ${gateway_api_namespace}
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cloudflare-kubernetes-gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values: [amd64, arm64, ppc64le, s390x]
                - key: kubernetes.io/os
                  operator: In
                  values: [linux]
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: 'ghcr.io/pl4nty/cloudflare-kubernetes-gateway:${gateway_api_version}'
        command: [/ko-app/cmd]
        args:
          - --metrics-bind-address=:8080
          - --leader-elect
          - --health-probe-bind-address=:8081
        env:
        - name: GATEWAY_IMAGE
          value: "docker.io/cloudflare/cloudflared:2026.6.0"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
      serviceAccountName: cloudflare-controller-manager
      terminationGracePeriodSeconds: 10
