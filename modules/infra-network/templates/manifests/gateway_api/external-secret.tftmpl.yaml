apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-gateway-token
  namespace: ${gateway_api_namespace}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: cloudflare-gateway-token
    creationPolicy: Owner
  data:
    - secretKey: ACCOUNT_ID
      remoteRef:
        key: ${cloudflare_account_id_secret}
    - secretKey: TOKEN
      remoteRef:
        key: ${cloudflare_api_token_secret}
