version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - /live/*
      - /modules/*
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns:
          - "*"
